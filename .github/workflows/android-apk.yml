name: Android APK

# Builds a debug APK (signed with the standard debug key, fine for installing on test phones).
# Download it from the run's "Artifacts" section.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test

      - name: Build web app (includes typecheck)
        run: npm run build

      - name: Copy web build into the Android project
        run: npx cap sync android

      # Capacitor 8 / AGP 8.13 need JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/stembot-control-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: stembot-control-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
